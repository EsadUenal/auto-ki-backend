<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Auto-KI — Testoberfläche</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f4f5; display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar { width: 280px; background: #18181b; color: #e4e4e7; display: flex; flex-direction: column; padding: 16px; gap: 12px; flex-shrink: 0; }
  #sidebar h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #71717a; margin-bottom: 4px; }
  #api-key { width: 100%; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; padding: 8px; border-radius: 6px; font-size: 13px; }
  .golden-btn { width: 100%; background: #27272a; border: 1px solid #3f3f46; color: #d4d4d8; padding: 8px 10px; border-radius: 6px; font-size: 12px; text-align: left; cursor: pointer; line-height: 1.4; }
  .golden-btn:hover { background: #3f3f46; border-color: #52525b; }
  #meta-box { background: #27272a; border-radius: 6px; padding: 10px; font-size: 12px; color: #a1a1aa; line-height: 1.8; }
  #meta-box b { color: #e4e4e7; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-db   { background: #166534; color: #bbf7d0; }
  .badge-web  { background: #92400e; color: #fde68a; }
  .badge-mix  { background: #1e40af; color: #bfdbfe; }
  .badge-hoch { background: #166534; color: #bbf7d0; }
  .badge-mtt  { background: #92400e; color: #fde68a; }
  .badge-nied { background: #7f1d1d; color: #fecaca; }

  /* Main Chat */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 720px; line-height: 1.6; }
  .msg-user { align-self: flex-end; background: #2563eb; color: #fff; padding: 10px 14px; border-radius: 12px 12px 2px 12px; }
  .msg-ki { align-self: flex-start; background: #fff; border: 1px solid #e4e4e7; padding: 12px 16px; border-radius: 2px 12px 12px 12px; color: #18181b; white-space: pre-wrap; }
  .msg-ki.streaming { border-color: #2563eb; }

  #input-row { display: flex; gap: 8px; padding: 16px; background: #fff; border-top: 1px solid #e4e4e7; }
  #user-input { flex: 1; border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px 14px; font-size: 15px; resize: none; height: 48px; font-family: inherit; }
  #user-input:focus { outline: none; border-color: #2563eb; }
  #send-btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 0 20px; font-size: 15px; cursor: pointer; }
  #send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  #clear-btn { background: #f4f4f5; border: 1px solid #d4d4d8; border-radius: 8px; padding: 0 14px; font-size: 13px; cursor: pointer; color: #52525b; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Einstellungen</h2>
  <input id="api-key" type="password" placeholder="API-Key" value="dev-key-change-in-prod">

  <h2 style="margin-top:8px">Golden Questions</h2>

  <button class="golden-btn" onclick="ask('Was ist der Unterschied zwischen einem F82 und einem G82 M4?')">
    F82 vs G82 — Niere + Motor
  </button>
  <button class="golden-btn" onclick="ask('Wie viel PS hat der M4 Competition G82?')">
    510 PS — exakt aus DB
  </button>
  <button class="golden-btn" onclick="ask('Welche bekannten Motorprobleme hat der F82?')">
    F82 Motorprobleme (Kurbelnabe etc.)
  </button>
  <button class="golden-btn" onclick="ask('Hat der M4 G82 ein Euro-NCAP-Ergebnis?')">
    NCAP G82 — muss null sagen
  </button>

  <h2 style="margin-top:8px">Letzte Antwort</h2>
  <div id="meta-box">—</div>
</div>

<div id="main">
  <div id="messages">
    <div class="msg msg-ki">Hallo! Ich bin Auto-KI. Stell mir eine Frage zum BMW M4 (F82 oder G82).</div>
  </div>
  <div id="input-row">
    <textarea id="user-input" placeholder="Frage stellen…" onkeydown="handleKey(event)"></textarea>
    <button id="clear-btn" onclick="clearChat()">Neu</button>
    <button id="send-btn" onclick="sendMessage()">Senden</button>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000/api/v1";
let verlauf = [];

function getKey() {
  return document.getElementById("api-key").value.trim();
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function ask(q) {
  document.getElementById("user-input").value = q;
  sendMessage();
}

function clearChat() {
  verlauf = [];
  document.getElementById("messages").innerHTML =
    '<div class="msg msg-ki">Chat zurückgesetzt.</div>';
  document.getElementById("meta-box").innerHTML = "—";
}

function appendMsg(text, role, streaming = false) {
  const el = document.createElement("div");
  el.className = "msg msg-" + role + (streaming ? " streaming" : "");
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  el.scrollIntoView({ behavior: "smooth" });
  return el;
}

function updateMeta(meta) {
  const quelle = meta.quelle || "—";
  const vertrauen = meta.vertrauen || "—";
  const refs = (meta.fahrzeug_referenz || []).join(", ") || "—";

  const quelleBadge = quelle === "datenbank" ? "badge-db"
                    : quelle === "web"        ? "badge-web"
                    :                           "badge-mix";
  const vertrBadge  = vertrauen === "hoch"    ? "badge-hoch"
                    : vertrauen === "mittel"   ? "badge-mtt"
                    :                           "badge-nied";

  document.getElementById("meta-box").innerHTML =
    `<b>Quelle:</b> <span class="badge ${quelleBadge}">${quelle}</span><br>` +
    `<b>Vertrauen:</b> <span class="badge ${vertrBadge}">${vertrauen}</span><br>` +
    `<b>Fahrzeuge:</b> ${refs}`;
}

async function sendMessage() {
  const input = document.getElementById("user-input");
  const message = input.value.trim();
  if (!message) return;

  input.value = "";
  document.getElementById("send-btn").disabled = true;

  appendMsg(message, "user");
  verlauf.push({ rolle: "user", text: message });

  const kiEl = appendMsg("", "ki", true);

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${getKey()}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ message, verlauf: verlauf.slice(0, -1), stream: true }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      kiEl.textContent = `Fehler: ${err?.fehler?.nachricht || resp.status}`;
      kiEl.classList.remove("streaming");
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    let fullAnswer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n\n");
      buffer = lines.pop(); // letztes unvollständiges Stück behalten

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (raw === "[DONE]") continue;

        let event;
        try { event = JSON.parse(raw); } catch { continue; }

        if (event.delta !== undefined) {
          fullAnswer += event.delta;
          kiEl.textContent = fullAnswer;
          kiEl.scrollIntoView({ behavior: "smooth" });
        }
        if (event.meta) {
          updateMeta(event.meta);
          verlauf.push({ rolle: "ki", text: event.meta.answer });
        }
      }
    }
    kiEl.classList.remove("streaming");
  } catch (e) {
    kiEl.textContent = `Verbindungsfehler: ${e.message}`;
    kiEl.classList.remove("streaming");
  } finally {
    document.getElementById("send-btn").disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
