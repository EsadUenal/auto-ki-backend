<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Auto-KI Admin — Fahrzeug befüllen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

/* ---- Layout ---- */
#app { display: flex; height: 100vh; }
#sidebar { width: 300px; background: #1e293b; border-right: 1px solid #334155;
           display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; flex-shrink:0; }
#main { flex: 1; overflow-y: auto; padding: 24px; }

/* ---- Sidebar ---- */
h1 { font-size: 16px; font-weight: 700; color: #f8fafc; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 4px; }
label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
input[type=text], input[type=password] {
  width: 100%; background: #0f172a; border: 1px solid #334155;
  color: #e2e8f0; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
input:focus { outline: none; border-color: #3b82f6; }

.btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 14px;
       font-weight: 600; cursor: pointer; transition: opacity .15s; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #2563eb; }
.btn-success { background: #16a34a; color: #fff; }
.btn-success:hover:not(:disabled) { background: #15803d; }
.btn-batch  { background: #7c3aed; color: #fff; }
.btn-batch:hover:not(:disabled)  { background: #6d28d9; }

#status-bar { font-size: 12px; padding: 8px 10px; border-radius: 6px; background: #1e293b;
              border: 1px solid #334155; color: #94a3b8; min-height: 36px; }
.status-ok   { color: #4ade80 !important; border-color: #166534 !important; }
.status-err  { color: #f87171 !important; border-color: #7f1d1d !important; }
.status-info { color: #93c5fd !important; }

/* ---- Batch Liste ---- */
#batch-list { display: flex; flex-direction: column; gap: 8px; }
.batch-item { background: #0f172a; border: 1px solid #334155; border-radius: 6px;
              padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.batch-item span { color: #cbd5e1; }
.batch-load { background: #1d4ed8; color: #fff; border: none; border-radius: 4px;
              padding: 4px 10px; font-size: 12px; cursor: pointer; }
.batch-load:hover { background: #1e40af; }

/* ---- Haupt-Editor ---- */
#editor-area { display: none; }
#editor-area h2 { font-size: 18px; color: #f8fafc; font-weight: 700; text-transform: none;
                  letter-spacing: 0; margin-bottom: 16px; }

.card { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
        padding: 20px; margin-bottom: 20px; }
.card h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
           color: #64748b; margin-bottom: 14px; }

.field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: #64748b; font-weight: 600; }
.field input, .field textarea, .field select {
  background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
  padding: 7px 9px; border-radius: 5px; font-size: 13px; font-family: inherit; }
.field input:focus, .field textarea:focus, .field select:focus
  { outline: none; border-color: #3b82f6; }
.field textarea { resize: vertical; min-height: 64px; }
.field.full { grid-column: 1 / -1; }
.field.highlight label { color: #fbbf24; }
.field.highlight input, .field.highlight textarea
  { border-color: #92400e; background: #1c1208; }

/* Dynamische Listen (Schwachstellen, Motoren etc.) */
.list-section { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.list-item { background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 12px; position: relative; }
.list-item .remove-btn { position: absolute; top: 8px; right: 8px; background: #7f1d1d;
  border: none; color: #fca5a5; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11px; }
.add-btn { background: #1e3a5f; border: 1px dashed #3b82f6; color: #93c5fd;
           border-radius: 6px; padding: 6px; font-size: 12px; cursor: pointer; margin-top: 6px; width: 100%; }
.add-btn:hover { background: #1e40af22; }

.motor-card { background: #162032; border: 1px solid #1e40af; border-radius: 8px;
              padding: 16px; margin-bottom: 12px; }
.motor-card h4 { color: #93c5fd; font-size: 12px; font-weight: 700; text-transform: uppercase;
                 letter-spacing: .6px; margin-bottom: 12px; }

.hints-box { background: #1c1208; border: 1px solid #92400e; border-radius: 6px;
             padding: 10px 12px; font-size: 12px; color: #fbbf24; margin-bottom: 16px; }
.hints-box b { color: #fde68a; }

/* Lücken-Batch — Badges */
.lk-badge { font-size: 10px; border-radius: 4px; padding: 2px 7px; font-weight: 700; white-space:nowrap; }
.lk-badge-processing { background:#1e3a5f; color:#60a5fa; }
.lk-badge-done       { background:#14532d; color:#4ade80; }
.lk-badge-skipped    { background:#1c1a08; color:#a16207; }
.lk-badge-error      { background:#450a0a; color:#f87171; }

/* Lücken-Batch — Draft-Karten im Hauptbereich */
.lk-draft-card { background:#1e293b; border:1px solid #f59e0b33; border-radius:10px;
                 margin-bottom:16px; overflow:hidden; }
.lk-draft-card.lk-active { border-color:#f59e0b; }
.lk-draft-header { display:flex; align-items:center; justify-content:space-between;
                   padding:14px 18px; cursor:pointer; background:#182030; user-select:none; }
.lk-draft-header:hover { background:#1e2d4a; }
.lk-draft-title { font-size:15px; font-weight:700; color:#f8fafc; }
.lk-draft-sub   { font-size:11px; color:#94a3b8; margin-top:3px; }
.lk-draft-body  { padding:18px; }

/* Spinner */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #334155;
           border-top-color: #3b82f6; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Streaming-Vorschau */
#stream-preview { display: none; background: #020817; border: 1px solid #1e40af;
  border-radius: 8px; padding: 14px; margin-bottom: 20px; font-family: monospace;
  font-size: 12px; color: #60a5fa; white-space: pre-wrap; word-break: break-all;
  max-height: 260px; overflow-y: auto; }
#stream-preview .sp-label { font-family: system-ui; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; color: #3b82f6; margin-bottom: 8px; display: block; }
</style>
</head>
<body>
<div id="app">

<!-- ===== SIDEBAR ===== -->
<div id="sidebar">
  <h1>Auto-KI Admin</h1>

  <div>
    <h2>API-Key</h2>
    <input id="api-key" type="password" value="dev-key-change-in-prod">
  </div>

  <div>
    <h2>Einzelnes Fahrzeug</h2>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div><label>Marke</label><input id="s-marke" type="text" placeholder="BMW"></div>
      <div><label>Modell</label><input id="s-modell" type="text" placeholder="3er"></div>
      <div><label>Generation</label><input id="s-gen" type="text" placeholder="G20"></div>
      <button class="btn btn-primary" id="btn-entwurf" onclick="entwurfErstellen()">Entwurf erstellen</button>
    </div>
  </div>

  <hr style="border-color:#334155">

  <div>
    <h2>Batch-Modus</h2>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div>
        <label>Anfrage</label>
        <input id="b-anfrage" type="text" placeholder="alle BMW 4er Generationen">
      </div>
      <button class="btn btn-batch" id="btn-batch" onclick="batchLaden()">Generationen auflisten</button>
    </div>
    <div id="batch-list" style="margin-top:12px"></div>
  </div>

  <hr style="border-color:#334155">

  <button class="btn btn-success" id="btn-speichern" onclick="speichern()" disabled>
    Prüfen &amp; Speichern
  </button>

  <hr style="border-color:#334155">

  <!-- ===== LÜCKEN-FÜLLER ===== -->
  <div>
    <h2 style="color:#f59e0b">Lücken nachfüllen</h2>
    <p style="font-size:11px;color:#64748b;margin-bottom:8px">Bestehende Baureihe — nur fehlende Felder per Gemini ergänzen. Motoren bleiben unverändert.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div>
        <label>Baureihe suchen</label>
        <input id="l-anfrage" type="text" placeholder="z.B. VW Golf 8"
               onkeydown="if(event.key==='Enter')lueckenSuchen()">
      </div>
      <button class="btn" style="background:#d97706;color:#fff" id="btn-luecken" onclick="lueckenSuchen()">
        Suchen &amp; Entwurf laden
      </button>
    </div>
    <div id="luecken-picker" style="display:none;flex-direction:column;gap:6px;margin-top:10px"></div>
    <button id="btn-luecken-batch" class="btn"
            style="display:none;margin-top:8px;background:#92400e;color:#fff"
            onclick="lueckenBatchAlle()">
      &#9654; Alle befüllen (Stapel)
    </button>
  </div>

  <div id="status-bar">Bereit.</div>
</div>

<!-- ===== HAUPT-EDITOR ===== -->
<div id="main">
  <div id="stream-preview">
    <span class="sp-label">Gemini generiert JSON <span id="sp-tokens">0</span> Zeichen...</span><span id="sp-text"></span>
  </div>

  <div id="editor-area">
    <h2 id="editor-title">Entwurf</h2>
    <div id="hints-container"></div>
    <div id="form-root"></div>
  </div>
  <div id="empty-hint" style="color:#475569;margin-top:80px;text-align:center;font-size:15px">
    ← Entwurf erstellen oder Batch-Modus nutzen
  </div>

  <!-- ===== LÜCKEN-ERGEBNIS (Batch) ===== -->
  <div id="luecken-area" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="font-size:18px;font-weight:700;color:#f8fafc">Lücken-Entwürfe</h2>
        <p id="luecken-area-sub" style="font-size:12px;color:#94a3b8;margin-top:2px"></p>
      </div>
      <button class="btn btn-success" id="btn-alle-speichern" onclick="lkAllesSpeichern()"
              style="width:auto;padding:10px 20px;display:none">
        Alle speichern
      </button>
    </div>
    <div id="lk-drafts-list"></div>
  </div>
</div>

</div><!-- #app -->

<script>
const API = "http://localhost:8000/api/v1";
let currentData = null;

function key() { return document.getElementById("api-key").value.trim(); }
function headers() { return { "Authorization": `Bearer ${key()}`, "Content-Type": "application/json" }; }

function setStatus(msg, type="info") {
  const el = document.getElementById("status-bar");
  el.textContent = msg;
  el.className = "status-" + type;
}

// ================================================================
//  ENTWURF ERSTELLEN — SSE-Streaming
// ================================================================
async function entwurfErstellen(marke, modell, generation) {
  marke      = marke      || document.getElementById("s-marke").value.trim();
  modell     = modell     || document.getElementById("s-modell").value.trim();
  generation = generation || document.getElementById("s-gen").value.trim();
  if (!marke || !modell || !generation) { setStatus("Marke, Modell und Generation eingeben.", "err"); return; }

  document.getElementById("btn-entwurf").disabled = true;
  document.getElementById("btn-speichern").disabled = true;

  // Vorschau einblenden, Editor ausblenden
  const preview   = document.getElementById("stream-preview");
  const spText    = document.getElementById("sp-text");
  const spTokens  = document.getElementById("sp-tokens");
  preview.style.display = "block";
  spText.textContent = "";
  spTokens.textContent = "0";
  document.getElementById("editor-area").style.display = "none";
  document.getElementById("empty-hint").style.display = "none";
  setStatus(`Gemini generiert ${marke} ${modell} ${generation}…`, "info");

  try {
    const resp = await fetch(`${API}/admin/entwurf-stream`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ marke, modell, generation }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      setStatus(err?.fehler?.nachricht || "Fehler " + resp.status, "err");
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";
    let charCount = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (raw === "[DONE]") continue;

        let evt;
        try { evt = JSON.parse(raw); } catch { continue; }

        if (evt.delta !== undefined) {
          // Rohen JSON-Text in Vorschau zeigen
          charCount += evt.delta.length;
          spText.textContent += evt.delta;
          spTokens.textContent = charCount;
          // Auto-scroll nach unten
          preview.scrollTop = preview.scrollHeight;
        }

        if (evt.done && evt.json) {
          preview.style.display = "none";
          ladeEntwurf(evt.json);

          if (evt.json._motorenfehler) {
            // Motorvarianten fehlen — Speichern blockieren, klare Warnung zeigen
            document.getElementById("btn-speichern").disabled = true;
            setStatus(
              "Motoren konnten nicht geladen werden — bitte Entwurf neu erstellen.",
              "err"
            );
            // Warnung auch oben im Editor sichtbar machen
            const warn = document.createElement("div");
            warn.style.cssText =
              "background:#7f1d1d;border:1px solid #ef4444;border-radius:6px;" +
              "padding:10px 14px;color:#fca5a5;font-size:13px;margin-bottom:16px;";
            warn.textContent =
              "Motorvarianten konnten nicht geladen werden. " +
              "Bitte Entwurf neu erstellen, bevor du speicherst.";
            document.getElementById("form-root").prepend(warn);
          } else {
            setStatus(`Entwurf fertig: ${marke} ${modell} ${generation}`, "ok");
          }
        }

        if (evt.status === "retry") {
          spText.textContent = "";
          charCount = 0;
          setStatus(`Antwort unvollständig — wiederhole (Versuch ${evt.versuch + 1}/2)…`, "info");
        }

        if (evt.status === "motoren") {
          setStatus("Baureihe geladen — lade Motorvarianten…", "info");
        }

        if (evt.error) {
          setStatus("Fehler: " + evt.error, "err");
          preview.style.display = "none";
        }
      }
    }
  } catch(e) {
    setStatus("Verbindungsfehler: " + e.message, "err");
    preview.style.display = "none";
  } finally {
    document.getElementById("btn-entwurf").disabled = false;
  }
}

// ================================================================
//  BATCH-MODUS
// ================================================================
async function batchLaden() {
  const anfrage = document.getElementById("b-anfrage").value.trim();
  if (!anfrage) { setStatus("Batch-Anfrage eingeben.", "err"); return; }

  document.getElementById("btn-batch").disabled = true;
  setStatus("Generationen werden aufgelistet…", "info");

  try {
    const r = await fetch(`${API}/admin/batch`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ anfrage }),
    });
    const j = await r.json();
    if (!r.ok) { setStatus(j?.fehler?.nachricht || "Fehler", "err"); return; }

    const list = document.getElementById("batch-list");
    list.innerHTML = "";
    for (const g of j.generationen) {
      const item = document.createElement("div");
      item.className = "batch-item";
      item.innerHTML = `<span>${g.marke} ${g.modell} <b>${g.generation}</b> (${g.baujahr_von}–${g.baujahr_bis||"heute"})</span>
        <button class="batch-load" onclick='entwurfErstellen(${JSON.stringify(g.marke)},${JSON.stringify(g.modell)},${JSON.stringify(g.generation)})'>Entwurf</button>`;
      list.appendChild(item);
    }
    setStatus(`${j.generationen.length} Generationen gefunden.`, "ok");
  } catch(e) {
    setStatus("Verbindungsfehler: " + e.message, "err");
  } finally {
    document.getElementById("btn-batch").disabled = false;
  }
}

// ================================================================
//  ENTWURF IN FORMULAR LADEN
// ================================================================
function ladeEntwurf(data) {
  currentData = data;
  document.getElementById("empty-hint").style.display = "none";
  document.getElementById("editor-area").style.display = "block";
  document.getElementById("editor-title").textContent =
    `${data.marke} ${data.modell} ${data.generation}`;
  document.getElementById("btn-speichern").disabled = false;

  // Hinweise-Box
  const hc = document.getElementById("hints-container");
  const hints = data.hinweise || {};
  if (Object.keys(hints).length > 0) {
    hc.innerHTML = `<div class="hints-box"><b>LLM-Hinweise (unsichere Werte):</b><br>` +
      Object.entries(hints).map(([k,v]) => `• ${k}: ${v}`).join("<br>") + `</div>`;
  } else {
    hc.innerHTML = "";
  }

  const root = document.getElementById("form-root");
  root.innerHTML = "";
  root.appendChild(cardEbene1(data));
  root.appendChild(cardAusstattung(data));
  root.appendChild(cardSchwachstellenBaureihe(data));
  root.appendChild(cardRueckrufe(data));
  root.appendChild(cardMotoren(data));
}

// ================================================================
//  FORMULAR-KARTEN
// ================================================================
function field(label, key, value, type="text", highlight=false, full=false) {
  const cls = ["field", full?"full":"", highlight?"highlight":""].filter(Boolean).join(" ");
  const val = value == null ? "" : value;
  if (type === "textarea") {
    return `<div class="${cls}"><label>${label}</label>
      <textarea data-key="${key}" rows="3">${val}</textarea></div>`;
  }
  return `<div class="${cls}"><label>${label}</label>
    <input type="text" data-key="${key}" value="${String(val).replace(/"/g,'&quot;')}"></div>`;
}

function cardEbene1(d) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>Ebene 1 — Baureihe</h3><div class="field-grid" id="fg-e1">
    ${field("ID (auto)", "id", d.id)}
    ${field("Marke", "marke", d.marke)}
    ${field("Modell", "modell", d.modell)}
    ${field("Generation", "generation", d.generation)}
    ${field("Baujahr von", "bauzeitraum_von", d.bauzeitraum_von)}
    ${field("Baujahr bis (leer=heute)", "bauzeitraum_bis", d.bauzeitraum_bis)}
    ${field("Karosserie (kommagetrennt)", "karosserie", Array.isArray(d.karosserie)?d.karosserie.join(", "):d.karosserie)}
    ${field("Segment", "segment", d.segment)}
    ${field("Vorgänger", "vorgaenger", d.vorgaenger)}
    ${field("Optische Erkennungsmerkmale", "erkennung_generation", d.erkennung_generation, "textarea", true, true)}
    ${field("Facelift-Merkmale", "facelift_merkmale", d.facelift_merkmale, "textarea", false, true)}
    ${field("ADAC Pannenkennziffer", "adac_pannenkennziffer", d.adac_pannenkennziffer)}
    ${field("TÜV Mängelquote", "tuev_maengelquote", d.tuev_maengelquote)}
    ${field("Dekra Urteil", "dekra_urteil", d.dekra_urteil)}
    ${field("Euro NCAP Sterne (0-5)", "euro_ncap_sterne", d.euro_ncap_sterne)}
    ${field("Euro NCAP Jahr", "euro_ncap_jahr", d.euro_ncap_jahr)}
    ${field("Ölwechsel-Intervall km", "wartung_oel_km", d.wartung_oel_km)}
    ${field("HU-Intervall", "wartung_hu_intervall", d.wartung_hu_intervall)}
    ${field("Letzte Aktualisierung", "letzte_aktualisierung", d.letzte_aktualisierung)}
    ${field("Kaufberatung", "kaufberatung", d.kaufberatung, "textarea", false, true)}
  </div>`;
  return div;
}

function cardAusstattung(d) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>Ausstattungslinien</h3><div class="list-section" id="ls-ausstattung"></div>
    <button class="add-btn" onclick="addAusstattungslinie()">+ Ausstattungslinie hinzufügen</button>`;
  setTimeout(() => {
    (d.ausstattungslinien || []).forEach(l => addAusstattungslinie(l));
  }, 0);
  return div;
}

function addAusstattungslinie(l={}) {
  const ls = document.getElementById("ls-ausstattung");
  const item = document.createElement("div");
  item.className = "list-item";
  item.innerHTML = `<button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    <div class="field-grid">
      <div class="field"><label>Name</label><input type="text" data-lkey="name" value="${l.name||''}"></div>
      <div class="field"><label>Typ</label>
        <select data-lkey="typ">
          ${["Basis","Ausstattungslinie","M Performance","Echtes M-Modell"].map(t =>
            `<option${l.typ===t?' selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="field full"><label>Optische Merkmale</label>
        <textarea data-lkey="optische_merkmale" rows="2">${l.optische_merkmale||''}</textarea></div>
      <div class="field full"><label>Abgrenzung</label>
        <textarea data-lkey="abgrenzung" rows="2">${l.abgrenzung||''}</textarea></div>
    </div>`;
  ls.appendChild(item);
}

function cardSchwachstellenBaureihe(d) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>Schwachstellen Baureihe</h3>
    <div class="list-section" id="ls-sw-baureihe"></div>
    <button class="add-btn" onclick="addSwBaureihe()">+ Schwachstelle hinzufügen</button>`;
  setTimeout(() => {
    (d.schwachstellen_baureihe || []).forEach(s => addSwBaureihe(s));
  }, 0);
  return div;
}

function addSwBaureihe(s={}) {
  const ls = document.getElementById("ls-sw-baureihe");
  const item = document.createElement("div");
  item.className = "list-item";
  item.innerHTML = `<button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    <div class="field-grid">
      <div class="field"><label>Bauteil</label><input type="text" data-swb="bauteil" value="${s.bauteil||''}"></div>

function parseNum(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : (String(v).includes(".") ? n : parseInt(v));
}
function nullOrStr(v) { return v === "" ? null : v; }
function commaList(v) { return v ? v.split(",").map(s=>s.trim()).filter(Boolean) : []; }

function leseFormular() {
  const get = (selector) => document.querySelector(selector);
  const val = (sel) => { const el = get(sel); return el ? el.value : ""; };

    d[el.dataset.key] = el.value;

  d.bauzeitraum_bis  = parseNum(d.bauzeitraum_bis);
  d.euro_ncap_sterne = parseNum(d.euro_ncap_sterne);

  d.wartung_oel_km   = parseNum(d.wartung_oel_km);

  ["adac_pannenkennziffer","tuev_maengelquote","dekra_urteil","facelift_merkmale",

// ================================================================
//  LÜCKEN-ENTWURF — Suche + Batch-Modus
// ================================================================

let lueckenQueue  = [];   // Array<{idx,marke,modell,gen,status,bid,fehlende_felder,entwurf,saved,errorMsg}>
let lueckenDraftMap = {}; // idx → DOM-Karte

// ── Hilfsfunktionen ──────────────────────────────────────────────

function escHtml(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function lkBadgeHtml(status, count) {
  if (status === "processing") return `<span class="lk-badge lk-badge-processing">lädt…</span>`;
  if (status === "done")       return `<span class="lk-badge lk-badge-done">${count} Felder</span>`;
  if (status === "skipped")    return `<span class="lk-badge lk-badge-skipped">vollständig</span>`;
  if (status === "error")      return `<span class="lk-badge lk-badge-error">Fehler</span>`;
  return "";
}

function lkSetBadge(idx, status, count) {
  lueckenQueue[idx].status = status;
  const el = document.getElementById(`lk-badge-${idx}`);
  if (el) el.innerHTML = lkBadgeHtml(status, count ?? 0);
}

function lkUpdateAllesSpeichernBtn() {
  const n = lueckenQueue.filter(q => q.status === "done" && !q.saved).length;
  const btn = document.getElementById("btn-alle-speichern");
  if (btn) btn.style.display = n > 1 ? "block" : "none";
}

function lkUpdateAreaSub() {
  const done  = lueckenQueue.filter(q => q.status === "done").length;
  const total = lueckenQueue.length;
  document.getElementById("luecken-area-sub").textContent =
    `${done} von ${total} Entwurf/Entwürfen bereit`;
}

// ── Suche ────────────────────────────────────────────────────────

async function lueckenSuchen() {
  const anfrage = document.getElementById("l-anfrage").value.trim();
  if (!anfrage) { setStatus("Baureihe eingeben (z.B. VW Golf 8).", "err"); return; }

  const btn    = document.getElementById("btn-luecken");
  const picker = document.getElementById("luecken-picker");
  btn.disabled = true;
  picker.innerHTML = "";
  picker.style.display = "none";
  document.getElementById("btn-luecken-batch").style.display = "none";
  document.getElementById("luecken-area").style.display = "none";
  document.getElementById("lk-drafts-list").innerHTML = "";
  lueckenQueue   = [];
  lueckenDraftMap = {};
  setStatus("Baureihen werden gesucht…", "info");

  try {
    const r = await fetch(`${API}/admin/batch`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ anfrage }),
    });
    const j = await r.json();
    if (!r.ok) { setStatus(j?.fehler?.nachricht || "Fehler", "err"); return; }

    const gens = j.generationen || [];
    if (!gens.length) { setStatus("Keine Baureihe gefunden — Eingabe präzisieren.", "err"); return; }

    lueckenQueue = gens.map((g, i) => ({
      idx: i, marke: g.marke, modell: g.modell, gen: g.generation,
      status: "waiting", bid: null, fehlende_felder: [], entwurf: null, saved: false, errorMsg: null,
    }));

    lkRenderPicker();
    picker.style.display = "flex";

    if (gens.length === 1) {
      await lueckenLadeEintrag(0);
    } else {
      document.getElementById("btn-luecken-batch").style.display = "block";
      setStatus(`${gens.length} Treffer — auswählen oder alle im Stapel laden.`, "info");
    }
  } catch(e) {
    setStatus("Verbindungsfehler: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
}

// ── Picker ───────────────────────────────────────────────────────

function lkRenderPicker() {
  const picker = document.getElementById("luecken-picker");
  picker.innerHTML = "";
  lueckenQueue.forEach((q, i) => {
    const item = document.createElement("div");
    item.className = "batch-item";
    item.id = `lk-pick-${i}`;
    item.style.cssText = "display:flex;align-items:center;gap:6px";
    item.innerHTML = `
      <span style="color:#64748b;font-size:11px;min-width:16px">${i + 1}.</span>
      <span style="flex:1;font-size:13px">${escHtml(q.marke)} ${escHtml(q.modell)} <b>${escHtml(q.gen)}</b></span>
      <span id="lk-badge-${i}"></span>
      <button class="batch-load" onclick="lueckenLadeEintrag(${i})">Wählen</button>
    `;
    picker.appendChild(item);
  });
}

// ── Einzel-Eintrag laden ─────────────────────────────────────────

async function lueckenLadeEintrag(idx) {
  const q = lueckenQueue[idx];
  if (!q) return;

  // Bereits fertig → zur Karte scrollen
  if ((q.status === "done" || q.status === "skipped") && lueckenDraftMap[idx]) {
    lueckenDraftMap[idx].scrollIntoView({ behavior: "smooth", block: "start" });
    lkFlashCard(idx);
    return;
  }

  lkSetBadge(idx, "processing");
  document.getElementById("editor-area").style.display = "none";
  document.getElementById("empty-hint").style.display = "none";
  document.getElementById("luecken-area").style.display = "block";
  setStatus(`Analysiere ${q.marke} ${q.modell} ${q.gen}…`, "info");

  try {
    const r = await fetch(`${API}/admin/luecken-entwurf`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ marke: q.marke, modell: q.modell, generation: q.gen }),
    });
    const j = await r.json();
    if (!r.ok) {
      q.errorMsg = j?.fehler?.nachricht || "Fehler " + r.status;
      lkSetBadge(idx, "error");
      setStatus(q.errorMsg, "err");
      lkRenderDraft(idx);
      return;
    }

    q.bid             = j.baureihe_id;
    q.fehlende_felder = j.fehlende_felder || [];
    q.entwurf         = j.entwurf;

    if (!j.entwurf) {
      lkSetBadge(idx, "skipped");
      setStatus(`${q.marke} ${q.modell} ${q.gen}: alle Felder bereits befüllt.`, "ok");
    } else {
      lkSetBadge(idx, "done", q.fehlende_felder.length);
      setStatus(`Entwurf fertig: ${q.marke} ${q.modell} ${q.gen} (${q.fehlende_felder.join(", ")}).`, "ok");
    }
    lkRenderDraft(idx);
    lkUpdateAllesSpeichernBtn();

  } catch(e) {
    q.errorMsg = e.message;
    lkSetBadge(idx, "error");
    setStatus("Verbindungsfehler: " + e.message, "err");
    lkRenderDraft(idx);
  }
}

// ── Stapel ───────────────────────────────────────────────────────

async function lueckenBatchAlle() {
  const waiting = lueckenQueue.filter(q => q.status === "waiting");
  if (!waiting.length) { setStatus("Alle Einträge bereits verarbeitet.", "info"); return; }

  const btn = document.getElementById("btn-luecken-batch");
  btn.disabled = true;
  setStatus(`Stapel: ${waiting.length} Baureihe(n) werden verarbeitet…`, "info");

  for (const q of waiting) {
    await lueckenLadeEintrag(q.idx);
    await new Promise(res => setTimeout(res, 400));
  }

  btn.disabled = false;
  const done = lueckenQueue.filter(q => q.status === "done").length;
  setStatus(`Stapel fertig — ${done} Entwurf/Entwürfe bereit zum Speichern.`, "ok");
}

// ── Draft-Karte rendern ──────────────────────────────────────────

function lkRenderDraft(idx) {
  const q    = lueckenQueue[idx];
  const list = document.getElementById("lk-drafts-list");

  const old = document.getElementById(`lk-draft-${idx}`);
  if (old) old.remove();

  const card = document.createElement("div");
  card.className = "lk-draft-card";
  card.id = `lk-draft-${idx}`;

  // Header
  const hdr = document.createElement("div");
  hdr.className = "lk-draft-header";
  hdr.onclick = () => lkToggleDraft(idx);
  const fieldInfo = q.fehlende_felder.length
    ? `${q.fehlende_felder.length} Felder: ${q.fehlende_felder.join(", ")}`
    : (q.status === "skipped" ? "Vollständig" : q.status === "error" ? "Fehler" : "");
  hdr.innerHTML = `
    <div>
      <div class="lk-draft-title">${escHtml(q.marke)} ${escHtml(q.modell)} ${escHtml(q.gen)}</div>
      <div class="lk-draft-sub">${q.bid ? "ID: " + q.bid + " · " : ""}${escHtml(fieldInfo)}</div>
    </div>
    <span id="lkd-chev-${idx}" style="color:#64748b;font-size:16px">▼</span>
  `;
  card.appendChild(hdr);

  // Body
  const body = document.createElement("div");
  body.className = "lk-draft-body";
  body.id = `lkd-body-${idx}`;

  if (q.status === "error") {
    body.innerHTML = `<p style="color:#f87171">${escHtml(q.errorMsg || "Fehler beim Laden.")}</p>`;
  } else if (q.status === "skipped") {
    body.innerHTML = `<p style="color:#a3e635">Alle Felder bereits befüllt — kein Entwurf nötig.</p>`;
  } else if (q.entwurf) {
    const e = q.entwurf;

    // Kaufberatung
    if (e.kaufberatung != null) {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "16px";
      wrap.innerHTML = `<h4 style="color:#fbbf24;font-size:12px;text-transform:uppercase;
        letter-spacing:.6px;margin-bottom:8px">Kaufberatung</h4>`;
      const ta = document.createElement("textarea");
      ta.id = `lkd-kb-${idx}`;
      ta.rows = 10;
      ta.style.cssText = "width:100%;background:#0f172a;border:1px solid #92400e;color:#e2e8f0;" +
        "padding:10px;border-radius:6px;font-size:13px;font-family:inherit;resize:vertical";
      ta.value = e.kaufberatung || "";
      wrap.appendChild(ta);
      body.appendChild(wrap);
    }

    // Schwachstellen
    if (Array.isArray(e.schwachstellen_baureihe) && e.schwachstellen_baureihe.length) {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "16px";
      wrap.innerHTML = `<h4 style="color:#f87171;font-size:12px;text-transform:uppercase;
        letter-spacing:.6px;margin-bottom:8px">Schwachstellen</h4>`;
      const sl = document.createElement("div");
      sl.className = "list-section";
      sl.id = `lkd-sw-${idx}`;
      e.schwachstellen_baureihe.forEach(s => {
        const it = document.createElement("div");
        it.className = "list-item";
        it.innerHTML = `<div class="field-grid">
          <div class="field"><label>Bauteil</label>
            <input type="text" data-lsw="bauteil" value="${escHtml(s.bauteil||'')}"></div>
          <div class="field"><label>Betroffene Baujahre</label>
            <input type="text" data-lsw="baujahre" value="${escHtml(s.betroffene_baujahre||'')}"></div>
          <div class="field"><label>Schweregrad</label>
            <select data-lsw="schweregrad">
              ${["gering","mittel","hoch"].map(g=>`<option${s.schweregrad===g?" selected":""}>${g}</option>`).join("")}
            </select></div>
          <div class="field full"><label>Beschreibung</label>
            <textarea data-lsw="beschreibung" rows="2">${escHtml(s.beschreibung||'')}</textarea></div>
        </div>`;
        sl.appendChild(it);
      });
      wrap.appendChild(sl);
      body.appendChild(wrap);
    }

    // Rückrufe
    if (Array.isArray(e.rueckrufe) && e.rueckrufe.length) {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "16px";
      wrap.innerHTML = `<h4 style="color:#a78bfa;font-size:12px;text-transform:uppercase;
        letter-spacing:.6px;margin-bottom:8px">KBA-Rückrufe</h4>`;
      const rl = document.createElement("div");
      rl.className = "list-section";
      rl.id = `lkd-rk-${idx}`;
      e.rueckrufe.forEach(r => {
        const it = document.createElement("div");
        it.className = "list-item";
        it.innerHTML = `<div class="field-grid">
          <div class="field"><label>Datum</label>
            <input type="text" data-lrk="datum" value="${escHtml(r.datum||'')}"></div>
          <div class="field"><label>Betroffene Baujahre</label>
            <input type="text" data-lrk="baujahre" value="${escHtml(r.betroffene_baujahre||'')}"></div>
          <div class="field"><label>KBA-Referenz</label>
            <input type="text" data-lrk="kba" value="${escHtml(r.kba_referenz||'')}"></div>
          <div class="field full"><label>Mangel</label>
            <textarea data-lrk="mangel" rows="2">${escHtml(r.mangel||'')}</textarea></div>
          <div class="field full"><label>Abhilfe</label>
            <textarea data-lrk="abhilfe" rows="2">${escHtml(r.abhilfe||'')}</textarea></div>
        </div>`;
        rl.appendChild(it);
      });
      wrap.appendChild(rl);
      body.appendChild(wrap);
    }

    // Speichern-Zeile
    const saveRow = document.createElement("div");
    saveRow.style.marginTop = "4px";
    const saveBtn = document.createElement("button");
    saveBtn.className = "btn btn-success";
    saveBtn.style.cssText = "width:auto;padding:8px 20px";
    saveBtn.id = `lkd-save-${idx}`;
    saveBtn.textContent = "Speichern";
    saveBtn.onclick = () => lkSpeichernIdx(idx);
    const savedLbl = document.createElement("span");
    savedLbl.id = `lkd-ok-${idx}`;
    savedLbl.style.cssText = "display:none;color:#4ade80;margin-left:10px;font-size:13px;font-weight:600";
    savedLbl.textContent = "Gespeichert!";
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(savedLbl);
    body.appendChild(saveRow);
  }

  card.appendChild(body);

  // Sortiert einfügen (nach idx)
  let inserted = false;
  for (const child of list.children) {
    if (parseInt(child.id.replace("lk-draft-", "")) > idx) {
      list.insertBefore(card, child);
      inserted = true;
      break;
    }
  }
  if (!inserted) list.appendChild(card);

  lueckenDraftMap[idx] = card;
  lkUpdateAreaSub();
  setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
}

function lkToggleDraft(idx) {
  const body = document.getElementById(`lkd-body-${idx}`);
  const chev = document.getElementById(`lkd-chev-${idx}`);
  if (!body) return;
  const open = body.style.display !== "none";
  body.style.display = open ? "none" : "block";
  if (chev) chev.textContent = open ? "▶" : "▼";
}

function lkFlashCard(idx) {
  const card = document.getElementById(`lk-draft-${idx}`);
  if (!card) return;
  card.classList.add("lk-active");
  setTimeout(() => card.classList.remove("lk-active"), 1200);
}

// ── Formular auslesen ────────────────────────────────────────────

function lkLeseFormularIdx(idx) {
  const daten = {};

  const kb = document.getElementById(`lkd-kb-${idx}`);
  if (kb?.value.trim()) daten.kaufberatung = kb.value.trim();

  const sw = document.getElementById(`lkd-sw-${idx}`);
  if (sw) {
    const items = [...sw.querySelectorAll(".list-item")].map(it => ({
      bauteil:             it.querySelector("[data-lsw=bauteil]")?.value    || "",
      beschreibung:        it.querySelector("[data-lsw=beschreibung]")?.value || "",
      betroffene_baujahre: it.querySelector("[data-lsw=baujahre]")?.value  || "",
      schweregrad:         it.querySelector("[data-lsw=schweregrad]")?.value || "gering",
    })).filter(s => s.bauteil);
    if (items.length) daten.schwachstellen_baureihe = items;
  }

  const rk = document.getElementById(`lkd-rk-${idx}`);
  if (rk) {
    const items = [...rk.querySelectorAll(".list-item")].map(it => ({
      datum:               it.querySelector("[data-lrk=datum]")?.value   || "",
      betroffene_baujahre: it.querySelector("[data-lrk=baujahre]")?.value || "",
      mangel:              it.querySelector("[data-lrk=mangel]")?.value  || "",
      abhilfe:             it.querySelector("[data-lrk=abhilfe]")?.value || "",
      kba_referenz:        it.querySelector("[data-lrk=kba]")?.value     || null,
    })).filter(r => r.mangel);
    if (items.length) daten.rueckrufe = items;
  }

  return daten;
}

// ── Speichern ────────────────────────────────────────────────────

async function lkSpeichernIdx(idx) {
  const q = lueckenQueue[idx];
  if (!q?.bid) return;

  const daten = lkLeseFormularIdx(idx);
  if (!Object.keys(daten).length) { setStatus("Keine Daten zum Speichern.", "err"); return; }

  const btn = document.getElementById(`lkd-save-${idx}`);
  if (btn) btn.disabled = true;
  setStatus(`Speichere ${q.marke} ${q.modell} ${q.gen}…`, "info");

  try {
    const r = await fetch(`${API}/admin/luecken-speichern`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ baureihe_id: q.bid, daten }),
    });
    const j = await r.json();
    if (!r.ok) {
      setStatus(j?.fehler?.nachricht || "Fehler " + r.status, "err");
      if (btn) btn.disabled = false;
      return;
    }
    q.saved = true;
    const lbl = document.getElementById(`lkd-ok-${idx}`);
    if (lbl) lbl.style.display = "inline";
    if (btn) { btn.disabled = false; btn.textContent = "Nochmals speichern"; }
    setStatus(j.nachricht || "Gespeichert!", "ok");
    lkUpdateAllesSpeichernBtn();
  } catch(e) {
    setStatus("Verbindungsfehler: " + e.message, "err");
    if (btn) btn.disabled = false;
  }
}

async function lkAllesSpeichern() {
  const unsaved = lueckenQueue.filter(q => q.status === "done" && !q.saved);
  if (!unsaved.length) { setStatus("Nichts Neues zu speichern.", "info"); return; }

  const btn = document.getElementById("btn-alle-speichern");
  btn.disabled = true;

  for (const q of unsaved) {
    await lkSpeichernIdx(q.idx);
    await new Promise(res => setTimeout(res, 200));
  }

  btn.disabled = false;
  setStatus("Alle Lücken gespeichert!", "ok");
}

// ================================================================
//  SPEICHERN
// ================================================================
async function speichern() {
  const daten = leseFormular();
  document.getElementById("btn-speichern").disabled = true;
  setStatus("Wird gespeichert…", "info");

  try {
    const r = await fetch(`${API}/admin/speichern`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ daten }),
    });
    const j = await r.json();
    if (!r.ok) { setStatus(j?.fehler?.nachricht || "Fehler beim Speichern", "err"); return; }
    setStatus(j.nachricht || "Gespeichert!", "ok");
  } catch(e) {
    setStatus("Verbindungsfehler: " + e.message, "err");
  } finally {
    document.getElementById("btn-speichern").disabled = false;
  }
}
</script>
